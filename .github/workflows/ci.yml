name: CI

on:
  push:
    branches: [main]
    # 纯文档提交不触发安装+测试+构建（规则仅在提交的全部文件都命中时生效）
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

# 测试与构建只需只读令牌
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      # 根 vitest 无 include 限制，src 与 web 的全部 *.test.ts 都在收集范围内
      - name: Test
        run: npm test

      # tsc + vue-tsc + vite build：类型检查与产物构建一并把关
      - name: Build
        run: npm run build
