name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 文档提交被路径过滤跳过时，也可手动触发
  workflow_dispatch:

# 测试与构建只需只读令牌
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      # 根 vitest 无 include 限制，src 与 web 的全部 *.test.ts 都在收集范围内
      - name: Test
        run: npm test

      # tsc + vue-tsc + vite build：类型检查与产物构建一并把关
      - name: Build
        run: npm run build
